[project]
name = "genetic-knapsack-solver"
version = "0.1.0"
description = "Учебный решатель subset-sum задачи генетическим алгоритмом."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
genetic-knapsack-solver = "genetic_knapsack_solver.cli:main"
genetic-knapsack-benchmark = "genetic_knapsack_solver.benchmark:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genetic_knapsack_solver"]
